<title>Painéis do mês</title>

<!--
  PROTÓTIPO DESCARTÁVEL do ticket 11 (Dashboards e fechamento do mês). Não é código de produção.
  Pergunta: quais visões a v1 mostra, e como?
  Três variações bem diferentes da mesma tela, trocadas pela barra flutuante (ou ← →):
    A = Painel do mês (uma página só, rolando)   B = App com abas   C = Planilha do ano
  Endereço: dashboards.html#A, #B ou #C (também aceita ?variant=A).
  Dados 100% fictícios, gerados aqui com semente fixa. Nada vem do Mobills. Nada é salvo.
  "Hoje" é 25/10/2026. A "Esposa" é um nome provisório.
-->
<style>

  --good:#0ca30c; --goodtxt:#006300; --warn:#fab219; --crit:#d03b3b; --crittxt:#b02a2a;
  --div-neg:#2a78d6; --div-pos:#d03b3b;
  --bar:#16161a; --barink:#f4f4f1;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0d0d; --surface:#1a1a19; --surface2:#242422; --ink:#f0efec; --ink2:#c3c2b7; --muted:#949189;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s1l:#1c5cab; --s2:#d95926; --s2l:#8a3d1e; --s3:#199e70;
  --goodtxt:#0ca30c; --crittxt:#e66767; --bar:#f0efec; --barink:#0b0b0b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#1a1a19; --surface2:#242422; --ink:#f0efec; --ink2:#c3c2b7; --muted:#949189;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s1l:#1c5cab; --s2:#d95926; --s2l:#8a3d1e; --s3:#199e70;

body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4;

select{font:inherit;font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid var(--axis);background:var(--surface);color:var(--ink);max-width:100%}

<div id="tip"></div>

<script>
// ======================= DADOS FICTÍCIOS =======================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261025);
const rnd=(a,b)=>a+R()*(b-a);
const pick=a=>a[Math.floor(R()*a.length)];
const r2=v=>Math.round(v*100)/100;
const key=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;
const pk=k=>{const[y,m]=k.split('-').map(Number);return{y,m}};
function addMes(k,n){let{y,m}=pk(k);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return key(y,m)}
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const nm=(k,longo)=>{const{y,m}=pk(k);return longo?`${MESL[m-1]} de ${y}`:`${MES[m-1]}/${String(y).slice(2)}`};
const HOJE=new Date(2026,9,25,12);
const MES_ATUAL='2026-10';
const PRIMEIRO='2025-01';
const PESSOAS=['Flávio','Esposa']; // nome provisório
const CARTOES={'Nubank':{fech:20,venc:27},'Itaú Click':{fech:3,venc:10}};
const SALDO_HOJE={'Itaú corrente':6240.15,'Poupança':61480,'Carteira':180};

const L=[];let nid=1;
function add(o){
  const l={id:nid++,tags:[],pessoa:null,origem:null,escolha:null,...o};
  if(!l.mes)l.mes=key(l.data.getFullYear(),l.data.getMonth()+1);
  l.sit=(l.data<=HOJE&&!l.prev)?'realizado':'previsto';
  l.atrasado=l.sit==='previsto'&&l.data<HOJE;
  L.push(l);return l;
}
const d=(y,m,dia)=>new Date(y,m-1,dia,12);
function dCartao(c,y,m,off){return new Date(y,m-2,CARTOES[c].fech+off,12)}
const pes=()=>pick([null,null,'Flávio','Esposa']);

function gerarMes(y,m){
  const k=key(y,m),f=y<2026?0.95:1,fut=k>MES_ATUAL;
  const v=(x,j=0.08)=>r2(x*f*(1+rnd(-j,j)));
  // receitas
  add({data:d(y,m,5),desc:'Salário',valor:r2(6200*f),tipo:'receita',cats:['Salário'],pessoa:'Flávio',meio:'Itaú corrente',origem:'recorrência'});
  add({data:d(y,m,28),desc:'Salário',valor:r2(4800*f),tipo:'receita',cats:['Salário'],pessoa:'Esposa',meio:'Itaú corrente',origem:'recorrência'});
  add({data:d(y,m,28),desc:'Rendimento da poupança',valor:v(310,.15),tipo:'receita',cats:['Rendimentos'],meio:'Poupança',origem:'recorrência'});
  if(m===12){add({data:d(y,m,18),desc:'13º salário',valor:r2(6200*f),tipo:'receita',cats:['Salário'],pessoa:'Flávio',meio:'Itaú corrente'});
             add({data:d(y,m,18),desc:'13º salário',valor:r2(4800*f),tipo:'receita',cats:['Salário'],pessoa:'Esposa',meio:'Itaú corrente'})}
  if(!fut&&R()<.35)add({data:d(y,m,15),desc:'Projeto freelance',valor:v(1800,.3),tipo:'receita',cats:['Freelance'],pessoa:'Flávio',meio:'Itaú corrente'});
  // recorrências na conta
  add({data:d(y,m,5),desc:'Aluguel',valor:r2(2300*f),tipo:'despesa',cats:['Moradia'],meio:'Itaú corrente',origem:'recorrência'});
  add({data:d(y,m,10),desc:'Condomínio',valor:r2(680*f),tipo:'despesa',cats:['Moradia'],meio:'Itaú corrente',origem:'recorrência'});
  add({data:d(y,m,15),desc:'Conta de luz',valor:fut?r2(180*f):v(180,.25),tipo:'despesa',cats:['Moradia'],meio:'Itaú corrente',origem:'recorrência (estimada)',prev:k===MES_ATUAL});
  add({data:d(y,m,12),desc:'Internet',valor:r2(120*f),tipo:'despesa',cats:['Moradia'],meio:'Itaú corrente',origem:'recorrência'});
  add({data:d(y,m,26),desc:'Diarista',valor:r2(720*f),tipo:'despesa',cats:['Moradia'],meio:'Itaú corrente',origem:'recorrência'});

function plano(k){
  const{y,m}=pk(k),f=y<2026?0.95:1;
  const p={Moradia:4000,Alimentação:1000,Carro:650,Saúde:900,Educação:400,Lazer:400,Família:250,Casa:300,Assinaturas:100};
  for(const c in p)p[c]=Math.round(p[c]*f/10)*10;
  if(m===1)p.Carro+=Math.round(2100*f);
  if(m===2)p.Moradia+=Math.round(1300*f);
  if((y===2026&&[1,7,10].includes(m))||(y===2025&&[1,7].includes(m)))p.Viagem=1500;
  if(k>='2026-07'&&k<='2026-11')p.Casa=1300;
  p.Reserva=1500;
  return p;
}
function itemDe(l){

  if(c.length===0)return null; if(c.length===1)return c[0];

}

function itens(k){

    if(it&&it!=='?'){by[it][l.sit==='realizado'?'r':'p']+=l.valor;by[it].lanc.push(l)}else if(!it&&l.tipo==='despesa')fora+=l.valor}
  rows.fora=fora;return rows;

// valor de uma categoria (ou total) num mês; antes de 2025 vem do histórico agregado
function hash(s){let h=2166136261;for(const ch of s)h=Math.imul(h^ch.charCodeAt(0),16777619);return((h>>>0)%1000)/1000}
const BASE_ANO={}; // por categoria, valor médio mensal de 2025
function despMes(k,cat){
  if(k>=PRIMEIRO){let s=0;for(const l of doMes(k)){if(l.tipo!=='despesa')continue;if(cat?l.cats.includes(cat):true)s+=l.valor}return s}
  const{y,m}=pk(k),f=Math.pow(0.94,2025-y);
  const cats=cat?[cat]:CATS_DESP;let s=0;
  for(const c of cats){let b=BASE_ANO[c]||0;
    if(c==='Viagem')b=[1,7].includes(m)?b*5.5:0; if(y===2020&&['Viagem','Lazer'].includes(c))b*=.3;
    if(c==='Casa')b=b*.4;
    s+=b*f*(0.85+hash(k+c)*.3)}
  if(!cat)s-=despMes(k,'Viagem')*.12; // sobreposição de categorias
  return s;
}
function recMes(k){
  if(k>=PRIMEIRO)return doMes(k).filter(l=>l.tipo==='receita').reduce((s,l)=>s+l.valor,0);
  const{y,m}=pk(k);const base=11300*Math.pow(0.93,2025-y);return base*(m===12?2:1)*(0.97+hash('r'+k)*.06)
}

function anos(){

}
// saldo das contas no fim de cada mês (passado: realizado; futuro: previstos e planejamento ainda não lançado)
function projecao(){
  const net=(k,sit)=>doMes(k).filter(l=>l.tipo!=='transferencia'&&(!sit||l.sit===sit)).reduce((s,l)=>s+(l.tipo==='receita'?l.valor:-l.valor),0);
  const hoje=Object.values(SALDO_HOJE).reduce((a,b)=>a+b,0);
  const rows=[];
  const iniAtual=hoje-net(MES_ATUAL,'realizado');
  let s=iniAtual;for(let i=1;i<=11;i++){const k=addMes(MES_ATUAL,-i);rows.unshift({k,real:s});s-=net(k)}
  let sp=hoje+net(MES_ATUAL,'previsto'),spl=sp-restante(itens(MES_ATUAL));
  rows.push({k:MES_ATUAL,real:null,hoje,prev:sp,plan:spl});
  for(let i=1;i<=12;i++){const k=addMes(MES_ATUAL,i);const n=net(k);const rest=restante(itens(k));sp+=n;spl+=n-rest;rows.push({k,prev:sp,plan:spl,n,rest})}
  rows[10].prev=rows[10].plan=rows[10].real;
  return{rows,hoje};
}

function niceTicks(min,max,n=4){if(max===min)max=min+1;const raw=(max-min)/n,p=Math.pow(10,Math.floor(Math.log10(raw)));const st=[1,2,2.5,5,10].map(x=>x*p).find(x=>x>=raw);
  const a=Math.floor(min/st)*st,b=Math.ceil(max/st)*st,t=[];for(let v=a;v<=b+st/2;v+=st)t.push(v);return t}
function pctDelta(a,b){if(!b)return null;return(a-b)/b}
function deltaHTML(a,b,receita){const p=pctDelta(a,b);if(p===null)return'<span class="delta muted">—</span>';const up=p>0;
  const cls=receita?(up?'rup':'rdown'):(up?'up':'down');return`<span class="delta ${cls}">${up?'▲':'▼'} ${Math.abs(p*100).toFixed(0)}%</span>`}

function lineChart(labels,series,o={}){
  const h=o.h||170,all=series.flatMap(s=>s.vals).filter(v=>v!=null);
  let mn=Math.min(...all),mx=Math.max(...all);if(o.zero)mn=Math.min(0,mn);const t=niceTicks(mn,mx);mn=t[0];mx=t[t.length-1];
  const n=labels.length,X=i=>(i+.5)/n*100,Y=v=>100-(v-mn)/(mx-mn)*100;
  let svg='',dots='';
  for(const s of series){let seg=[],cur=[];s.vals.forEach((v,i)=>{if(v==null){if(cur.length)seg.push(cur);cur=[]}else cur.push([X(i),Y(v)])});if(cur.length)seg.push(cur);
    for(const c of seg)svg+=`<polyline points="${c.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    if(s.dotLast!=null){const i=s.dotLast;dots+=`<span class="dot" style="left:${X(i)}%;top:${Y(s.vals[i])}%;background:${s.color}"></span>`}}
  const hit=labels.map((lb,i)=>`<div data-tip="${esc(`<b>${o.tipLabel?o.tipLabel(i):lb}</b><br>`+series.filter(s=>s.vals[i]!=null).map(s=>`${s.name}: ${brl0(s.vals[i])}`).join('<br>'))}"></div>`).join('');
  const grid=t.map(v=>`<div class="gl ${v===0?'base':''}" style="top:${Y(v)}%"><span>${kf(v)}</span></div>`).join('');
  const ev=o.every||(labels.length>18?3:labels.length>13?2:0);
  const xl=labels.map((lb,i)=>`<span>${(ev&&i%ev)?'':lb}</span>`).join('');
  const legend=series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}${s.dash?';opacity:.6':''}"></i>${s.name}</span>`).join('')}</div>`:'';
  const fut=o.futFrom!=null?`<div style="position:absolute;top:0;bottom:0;left:${o.futFrom/n*100}%;right:0;background:repeating-linear-gradient(135deg,rgba(127,127,127,.06) 0 2px,transparent 2px 7px)"></div>`:'';
  return`${legend}<div class="chart ywrap"><div class="plot" style="height:${h}px">${fut}${grid}<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svg}</svg>${dots}<div class="hit">${hit}</div></div><div class="xl">${xl}</div></div>`;
}
// colunas agrupadas; cada valor {r,p} empilha realizado + previsto (hachurado)
function colChart(labels,series,o={}){

function hbars(rows,o={}){

    <div class="v num">${brl0(r.r+r.p)}</div>`).join('')}</div>`;

function donut(parts){
  const tot=parts.reduce((s,p)=>s+p.v,0);let a=-Math.PI/2,out='';const R1=52,R0=34,c=60;
  parts.forEach(p=>{const da=p.v/tot*Math.PI*2,a2=a+da,lg=da>Math.PI?1:0;
    const P=(r,an)=>`${c+r*Math.cos(an)},${c+r*Math.sin(an)}`;
    out+=`<path d="M${P(R1,a)} A${R1},${R1} 0 ${lg} 1 ${P(R1,a2)} L${P(R0,a2)} A${R0},${R0} 0 ${lg} 0 ${P(R0,a)}Z" fill="${p.color}" stroke="var(--surface)" stroke-width="2"><title>${p.nome}: ${brl0(p.v)}</title></path>`;a=a2});
  return`<div class="row wrap" style="gap:16px"><svg viewBox="0 0 120 120" width="130" height="130">${out}<text x="60" y="58" text-anchor="middle" font-size="9" fill="var(--muted)">total</text><text x="60" y="71" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${kf(tot)}</text></svg>
   <div class="stack" style="gap:6px">${parts.map(p=>`<div class="row small"><i style="width:10px;height:10px;border-radius:2px;background:${p.color};display:inline-block"></i><span>${p.nome}</span><b class="num">${brl0(p.v)}</b><span class="muted">${(p.v/tot*100).toFixed(0)}%</span></div>`).join('')}</div></div>`;
}
function natureza(k){

  const cor={'Essencial':'var(--s1)','Estilo de vida':'var(--s2)','Projetos':'var(--s3)'};

function pbar(it){

function fechamentoResumo(k){
  const t=totais(k),its=itens(k),ant=totais(addMes(k,-1));
  const sobra=t.rec.r-t.desp.r,pct=sobra/t.rec.r;
  const est=despItens(its).filter(i=>i.r+i.p>i.plan).sort((a,b)=>(b.r-b.plan)-(a.r-a.plan));

  return{t,sobra,pct,est,ok,maior,ant,its};
}

  else{const ys=[2019,2020,2021,2022,2023,2024,2025,2026];const v=ys.map(y=>val(key(y,10)));

  const a=val(MES_ATUAL),b=val(addMes(MES_ATUAL,-1)),c=val(addMes(MES_ATUAL,-12)),rec=S.hMet==='rec'||S.hMet==='sobra';

function renderC(){
  const anosM=S.cCols==='anos';
  const cols=anosM?[2019,2020,2021,2022,2023,2024,2025,2026].map(y=>({id:String(y),lbl:y===2026?'2026*':String(y),ks:Array.from({length:y===2026?10:12},(_,i)=>key(y,i+1))}))
    :[...meses12(MES_ATUAL).map(k=>({id:k,lbl:nm(k),ks:[k]})),...[1,2,3].map(i=>{const k=addMes(MES_ATUAL,i);return{id:k,lbl:nm(k),ks:[k],fut:1}})];
  const selK=S.cMes,ant=addMes(selK,-1),aa=addMes(selK,-12);
  const sum=(ks,f)=>ks.reduce((s,k)=>s+f(k),0);
  // linhas
  let groups=[];
  const cellDesp=(ks,pred)=>{let s=0,p=0,q=0;for(const k of ks){if(k<PRIMEIRO)continue;for(const l of doMes(k)){if(l.tipo!=='despesa'&&l.tipo!=='transferencia')continue;if(!pred(l))continue;l.sit==='previsto'?p+=l.valor:s+=l.valor;if(itemDe(l)==='?')q++}}return{v:s+p,p,q}};
  if(S.cMode==='cat'){
    groups.push({nome:'Receitas',rows:[...CATS_REC.map(c=>({id:'r:'+c,nome:c,f:ks=>({v:sum(ks,k=>k<PRIMEIRO?(c==='Salário'?recMes(k)*.97:c==='Rendimentos'?recMes(k)*.03:0):doMes(k).filter(l=>l.tipo==='receita'&&l.cats.includes(c)).reduce((s,l)=>s+l.valor,0))})})),
      {id:'rt',nome:'Total de receitas',tot:1,f:ks=>({v:sum(ks,recMes)})}]});
    groups.push({nome:'Despesas por categoria',rows:[...CATS_DESP.map(c=>({id:'c:'+c,nome:c,cat:c,f:ks=>ks.some(k=>k<PRIMEIRO)?{v:sum(ks,k=>despMes(k,c))}:cellDesp(ks,l=>l.tipo==='despesa'&&l.cats.includes(c))})),
      {id:'soma',nome:'Soma das categorias',soft:1,f:ks=>({v:sum(ks,k=>CATS_DESP.reduce((s,c)=>s+despMes(k,c),0))})},
      {id:'dt',nome:'Total de despesas',tot:1,f:ks=>({v:sum(ks,k=>despMes(k))})}]});
  }else if(S.cMode==='tag'){
    const tags=[...new Set(L.flatMap(l=>l.tags))];
    groups.push({nome:'Despesas por tag',rows:tags.map(t=>({id:'t:'+t,nome:'#'+t,f:ks=>cellDesp(ks,l=>l.tags.includes(t))}))});
  }else if(S.cMode==='pessoa'){
    groups.push({nome:'Despesas por pessoa',rows:[...PESSOAS,'Conjunto'].map(p=>({id:'p:'+p,nome:p,f:ks=>ks.some(k=>k<PRIMEIRO)?{v:null}:cellDesp(ks,l=>l.tipo==='despesa'&&(l.pessoa||'Conjunto')===p)}))});
  }else{
    groups.push({nome:'Faturas por cartão',rows:Object.keys(CARTOES).map(c=>({id:'k:'+c,nome:c,f:ks=>ks.some(k=>k<PRIMEIRO)?{v:null}:cellDesp(ks,l=>l.meio===c)})).concat([{id:'k:conta',nome:'Pago direto da conta',f:ks=>ks.some(k=>k<PRIMEIRO)?{v:null}:cellDesp(ks,l=>l.tipo==='despesa'&&!CARTOES[l.meio])}])});
  }
  const proj=projecao().rows;const saldoDe=k=>{const r=proj.find(x=>x.k===k);return r?(r.real??r.plan):null};
  groups.push({nome:'Resultado',rows:[
    {id:'gr',nome:'Guardado na reserva',f:ks=>({v:ks.some(k=>k<PRIMEIRO)?null:cellDesp(ks,l=>l.tipo==='transferencia').v})},
    {id:'sb',nome:'Sobra (receitas − despesas)',tot:1,f:ks=>({v:sum(ks,recMes)-sum(ks,k=>despMes(k))})},
    ...(anosM?[]:[{id:'sd',nome:'Saldo das contas no fim',f:ks=>({v:saldoDe(ks[0])})}])]});
  // cor da célula: relação com o planejado (só categorias, só meses)
  const shade=(row,col,cell)=>{if(anosM||col.fut||!row.cat||cell.v==null)return'';const p=plano(col.id)[row.cat];if(p==null)return'';
    const x=Math.max(-1,Math.min(1,(cell.v-p)/p));const a=Math.min(.5,Math.abs(x)*.9);
    return x>0.02?`background:color-mix(in srgb,var(--div-pos) ${a*100}%,transparent)`:x<-0.02?`background:color-mix(in srgb,var(--div-neg) ${a*60}%,transparent)`:''};
  const spark=row=>{if(anosM)return'';const ks=meses12(MES_ATUAL);const v=ks.map(k=>row.f([k]).v||0);const mx=Math.max(...v,1);
    return`<svg class="spark" width="48" height="14" viewBox="0 0 48 14"><polyline points="${v.map((x,i)=>`${i/11*46+1},${13-x/mx*12}`).join(' ')}" fill="none" stroke="var(--s1)" stroke-width="1.5"/></svg>`};
  const cmp=!anosM&&S.cCmp;
  const head=`<tr><th class="rh">${S.cMode==='cat'?'Categoria':S.cMode==='tag'?'Tag':S.cMode==='pessoa'?'Pessoa':'Onde'}</th>${cols.map(c=>`<th class="${!anosM&&c.id===selK?'sel':''}">${anosM?c.lbl:`<button data-act="cmes" data-v="${c.id}">${c.lbl}</button>`}</th>`).join('')}${anosM?'':'<th>Média 12m</th>'}${cmp?`<th>${nm(selK)} × ${nm(ant)}</th><th>× ${nm(aa)}</th>`:''}</tr>`;
  const body=groups.map(g=>`<tr class="grp"><td colspan="${cols.length+(anosM?1:2)+(cmp?2:0)}">${g.nome}</td></tr>`+g.rows.map(row=>{
    const cells=cols.map(col=>{const c=row.f(col.ks);const on=S.cSel&&S.cSel.r===row.id&&S.cSel.c===col.id;
      const pl=!anosM&&row.cat?plano(col.id)[row.cat]:null;
      const tip=`<b>${row.nome} · ${anosM?col.lbl:nm(col.id,1)}</b><br>${c.v==null?'sem dado':brl0(c.v)}${c.p?`<br>previsto ${brl0(c.p)}`:''}${pl!=null?`<br>planejado ${brl0(pl)}`:''}${c.q?`<br>${c.q} a escolher`:''}`;
      return`<td class="num ${col.fut?'fut':''} ${!anosM&&row.cat||row.id.match(/^[tpk]:/)?'cell':''} ${on?'on':''}" style="${shade(row,col,c)}" data-tip="${esc(tip)}" ${!anosM&&(row.cat||row.id.match(/^[tpk]:/))?`data-act="ccell" data-r="${esc(row.id)}" data-c="${col.id}"`:''}>${c.v==null?'<span class="muted">—</span>':kf(c.v)}${c.q?`<span class="q">${c.q}?</span>`:''}</td>`}).join('');
    const med=anosM?'':`<td class="num muted">${(()=>{const v=meses12(MES_ATUAL).map(k=>row.f([k]).v).filter(x=>x!=null);return v.length?kf(v.reduce((a,b)=>a+b,0)/v.length):'—'})()}</td>`;
    const dl=cmp?(()=>{const a=row.f([selK]).v,b=row.f([ant]).v,y=row.f([aa]).v;const rec=row.id.startsWith('r')||row.id==='sb'||row.id==='sd'||row.id==='gr';return`<td>${a!=null&&b?deltaHTML(a,b,rec):'—'}</td><td>${a!=null&&y?deltaHTML(a,y,rec):'—'}</td>`})():'';
    return`<tr class="${row.tot?'tot':''} ${row.soft?'soft':''}"><td class="rh">${esc(row.nome)}${spark(row)}</td>${cells}${med}${dl}</tr>`}).join('')).join('');
  // faixa do mês selecionado
  const t=totais(selK),its=itens(selK),di=despItens(its),es=aEscolher(selK),plan=di.reduce((s,i)=>s+i.plan,0);
  const kp=`<div class="kpis"><div><span class="small muted">${nm(selK,1)}${selK<MES_ATUAL?' · fechado':selK===MES_ATUAL?' · atual':' · previsto'}</span><b>${selK<MES_ATUAL?'Fechamento':'Em andamento'}</b></div>
   <div><span class="small muted">Receitas</span><b class="num">${brl0(t.rec.r+t.rec.p)}</b>${t.rec.p?`<span class="small muted">${brl0(t.rec.p)} previsto</span>`:''}</div>
   <div><span class="small muted">Despesas</span><b class="num">${brl0(t.desp.r+t.desp.p)}</b>${t.desp.p?`<span class="small muted">${brl0(t.desp.p)} previsto</span>`:''}</div>
   <div><span class="small muted">Planejado</span><b class="num">${brl0(plan)}</b><span class="small ${t.desp.r+t.desp.p>plan?'pill-bad':'pill-ok'}">${t.desp.r+t.desp.p>plan?'⚠ acima':'✓ dentro'}</span></div>
   <div><span class="small muted">Sobra</span><b class="num">${brl0(t.rec.r+t.rec.p-t.desp.r-t.desp.p)}</b></div>
   <div><span class="small muted">A escolher</span><b class="num">${es.length}</b></div></div>`;
  let drawer='';
  if(S.cSel){const col=cols.find(c=>c.id===S.cSel.c);const row=groups.flatMap(g=>g.rows).find(r=>r.id===S.cSel.r);
    if(col&&row){const[tp,nmv]=[row.id.slice(0,1),row.id.slice(2)];
      const ls=L.filter(l=>col.ks.includes(l.mes)&&(tp==='c'?l.tipo==='despesa'&&l.cats.includes(nmv):tp==='t'?l.tags.includes(nmv):tp==='p'?l.tipo==='despesa'&&(l.pessoa||'Conjunto')===nmv:nmv==='conta'?l.tipo==='despesa'&&!CARTOES[l.meio]:l.meio===nmv)).sort((a,b)=>a.data-b.data);
      const pl=tp==='c'?plano(col.id)[nmv]:null;
      drawer=`<div class="drawer"><div class="row between"><h2>${esc(row.nome)} · ${nm(col.id,1)}</h2><button data-act="cclose" aria-label="Fechar" style="font-size:18px">×</button></div>
       <div class="small ink2">${ls.length} lançamentos · ${brl(ls.reduce((s,l)=>s+l.valor,0))}${pl!=null?` · planejado ${brl0(pl)}`:''}${tp==='c'?' · aqui entra todo lançamento com essa categoria, mesmo que conte em outro item do planejamento':''}</div>
       ${ls.filter(l=>itemDe(l)==='?').map(escolherCard).join('')}
       <div class="scroll"><table class="tbl"><thead><tr><th>Data</th><th>Descrição</th><th style="text-align:left">Categorias e tags</th><th>Onde</th><th>Conta no item</th><th>Valor</th></tr></thead><tbody>
       ${ls.map(l=>`<tr><td class="muted">${dd(l.data)}</td><td style="text-align:left">${esc(l.desc)}</td><td style="text-align:left">${chipsLanc(l)}</td><td class="muted">${l.meio}</td><td>${itemDe(l)==='?'?'<span class="q" style="font-size:10px;font-weight:700;color:#0b0b0b;background:var(--warn);border-radius:6px;padding:0 4px">a escolher</span>':(itemDe(l)||'—')}</td><td>${brl(l.valor)}</td></tr>`).join('')}</tbody></table></div></div>`}}
  return`<div class="vc"><div class="bar1"><h1>Planilha do ano</h1>
   <div class="row wrap"><div class="seg">${[['cat','Categoria'],['tag','Tag'],['pessoa','Pessoa'],['cartao','Cartão']].map(([v,l])=>`<button data-act="cmode" data-v="${v}" aria-pressed="${S.cCols==='anos'&&v!=='cat'?false:S.cMode===v}">${l}</button>`).join('')}</div>
   <div class="seg">${[['meses','Meses'],['anos','Anos']].map(([v,l])=>`<button data-act="ccols" data-v="${v}" aria-pressed="${S.cCols===v}">${l}</button>`).join('')}</div>
   ${anosM?'':`<label class="small row"><input type="checkbox" id="ccmp" data-act="ccmp" ${S.cCmp?'checked':''}> comparar</label>`}</div></div>
   ${anosM?'':kp}
   ${!anosM&&es.length&&!S.cSel?`<div class="drawer"><h2>A escolher em ${nm(selK,1)}</h2>${es.map(escolherCard).join('')}</div>`:''}
   ${drawer}
   <div class="sheetwrap"><table class="ss"><thead>${head}</thead><tbody>${body}</tbody></table></div>
   <div class="legend"><span><i style="background:color-mix(in srgb,var(--div-pos) 45%,transparent)"></i>acima do planejado</span><span><i style="background:color-mix(in srgb,var(--div-neg) 30%,transparent)"></i>abaixo do planejado</span><span><i class="hatch" style="background-color:var(--surface2)"></i>meses futuros: só previstos</span><span><i style="background:var(--warn)"></i>a escolher</span></div>
   <div class="note">Clique no nome do mês para ver o resumo dele; clique numa célula para abrir os lançamentos. A linha "Soma das categorias" passa do total porque um lançamento conta inteiro em cada categoria. ${anosM?'2019 a 2024 vêm do histórico importado; tag, pessoa e cartão só existem a partir de 2025 neste protótipo. * 2026 até outubro.':''}</div></div>`;
}

function curVar(){const q=new URLSearchParams(location.search).get('variant');const h=location.hash.slice(1).toUpperCase();const v=(h||q||'A').toUpperCase();return VAR.find(x=>x[0]===v)?v:'A'}
let V=curVar();
function render(){const x=VAR.find(v=>v[0]===V);document.getElementById('app').innerHTML=x[2]();
  document.getElementById('swl').innerHTML=`${x[0]} <small>(${x[1]})</small>`;document.getElementById('tip').style.display='none'}
function go(n){const i=VAR.findIndex(v=>v[0]===V);V=VAR[(i+n+VAR.length)%VAR.length][0];try{history.replaceState(null,'','#'+V)}catch(e){location.hash=V}render();window.scrollTo(0,0)}
document.getElementById('swp').onclick=()=>go(-1);document.getElementById('swn').onclick=()=>go(1);
addEventListener('hashchange',()=>{V=curVar();render()});
addEventListener('keydown',e=>{const t=e.target;if(t.closest&&t.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==='mes'){S.mes=addMes(S.mes,+v)}
  else if(a==='open'){S.open.has(v)?S.open.delete(v):S.open.add(v)}
  else if(a==='dim'){S.dim=v}
  else if(a==='per'){S.per=v}
  else if(a==='pizza'){S.pizza=!S.pizza}
  else if(a==='escolher'){const l=L.find(x=>x.id===+b.dataset.id);l.escolha=v}
  else if(a==='tab'){S.tab=v;if(v==='mes')S.mes=MES_ATUAL;window.scrollTo(0,0)}
  else if(a==='sheet'){S.sheet=v;S.sheetTag=null}
  else if(a==='close'){S.sheet=null}
  else if(a==='stag'){S.sheetTag=v||null}
  else if(a==='hper'){S.hPer=v}
  else if(a==='cmode'){S.cMode=v;S.cSel=null;if(v!=='cat')S.cCols='meses'}
  else if(a==='ccols'){S.cCols=v;S.cSel=null;if(v==='anos')S.cMode='cat'}
  else if(a==='cmes'){S.cMes=v>MES_ATUAL?MES_ATUAL:v;S.cSel=null}
  else if(a==='ccell'){S.cSel={r:b.dataset.r,c:b.dataset.c};if(b.dataset.c<=MES_ATUAL)S.cMes=b.dataset.c}
  else if(a==='cclose'){S.cSel=null}
  else if(a==='ccmp'){S.cCmp=b.checked}
  else return;
  render()});
document.addEventListener('change',e=>{if(e.target.dataset.act==='hmet'){S.hMet=e.target.value;render()}});
const tip=document.getElementById('tip');
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}
  tip.innerHTML=t.dataset.tip;tip.style.display='block';const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+12,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-12;if(y+h>innerHeight-8)y=e.clientY-h-12;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'});
document.addEventListener('pointerleave',()=>tip.style.display='none');
render();
</script>
