name: Deploy

# O merge na main publica em prod; push em outra branch, ou o botão, publica em dev.
# Ordem: banco, login e bucket do backup, migrations e papéis `api` e `backup` no DSQL, build da
# PWA com o login do ambiente, Lambda, site e um backup conferido, teste de fumaça (ADR 0010 e 0012).
on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "web/**"
      - "infra/**"
      - "config/**"
      - "scripts/empacotar-lambda.sh"
      - "scripts/conferir-deploy.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: credencial temporária, sem chave de longa duração

jobs:
  deploy:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    # O GitHub Environment "prod" está protegido por regra de branch main-only.
    # Declarar o environment aqui faz o sub do token OIDC terminar em :environment:prod,
    # que é a única condição aceita pela role financial-app-deploy-prod.
    environment: ${{ github.ref_name == 'main' && github.event_name == 'push' && 'prod' || '' }}
    env:
      AMBIENTE: ${{ github.ref_name == 'main' && github.event_name == 'push' && 'prod' || 'dev' }}
      # O repositório é público: conta e e-mail do dono ficam em secrets (o log os mascara).
      AWS_CONTA: ${{ secrets.AWS_CONTA }}
      EMAIL_DO_DONO: ${{ secrets.EMAIL_DO_DONO }}
      # Variável (não secret) de cada GitHub Environment, dev e prod: {"<sub>": "<nome>"}.
      PESSOAS: ${{ vars.PESSOAS }}
    # Um deploy por vez em cada pilha; o dev é dividido por todas as branches.
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && github.event_name == 'push' && 'prod' || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            infra/package-lock.json

      - name: Secrets e região da configuração
        run: |
          for nome in AWS_CONTA EMAIL_DO_DONO; do
            [ -n "${!nome}" ] || { echo "::error::falta o secret $nome (veja o README, seção Deploy)"; exit 1; }
          done
          echo "AWS_REGIAO=$(jq -r .regiao config/aws.json)" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_CONTA }}:role/financial-app-deploy-${{ env.AMBIENTE }}
          aws-region: ${{ env.AWS_REGIAO }}

      - name: Pacote da Lambda e CDK
        # O primeiro build da PWA só serve à síntese: sem web/dist o CDK deixa a pilha do app
        # de fora e as exportações que ela importa sumiriam da pilha de dados.
        run: |
          scripts/empacotar-lambda.sh
          (cd web && npm ci && npm run build)
          (cd infra && npm ci)

      - name: Banco e login (pilha de dados)
        working-directory: infra
        run: |
          npx cdk deploy "financial-$AMBIENTE-dados" --exclusively --require-approval never
          aws cloudformation set-stack-policy --stack-name "financial-$AMBIENTE-dados" \
            --stack-policy-body file://politicas/dados.json

      - name: Migrations e papéis no DSQL, antes da Lambda nova
        working-directory: backend
        run: |
          export DSQL_ENDPOINT=$(aws cloudformation describe-stacks --stack-name "financial-$AMBIENTE-dados" \
            --query "Stacks[0].Outputs[?OutputKey=='DsqlEndpoint'].OutputValue" --output text)
          export API_ROLE_ARN=$(aws cloudformation describe-stacks --stack-name "financial-$AMBIENTE-dados" \
            --query "Stacks[0].Outputs[?OutputKey=='RoleDaApiArn'].OutputValue" --output text)
          export BACKUP_ROLE_ARN=$(aws cloudformation describe-stacks --stack-name "financial-$AMBIENTE-dados" \
            --query "Stacks[0].Outputs[?OutputKey=='RoleDoBackupArn'].OutputValue" --output text)
          uv run --no-dev python -m app.migrations

      - name: Build da PWA com o user pool do ambiente
        working-directory: web
        run: |
          saida() {
            aws cloudformation describe-stacks --stack-name "financial-$AMBIENTE-dados" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          export VITE_COGNITO_USER_POOL_ID=$(saida UserPoolId)
          export VITE_COGNITO_CLIENTE_ID=$(saida ClienteDoAppId)
          npm run build

      - name: Lambda, HTTP API, site e backup diário (pilha do app)
        working-directory: infra
        # O deploy com código novo roda um backup e falha se ele falhar (Trigger do CDK).
        run: |
          npx cdk deploy "financial-$AMBIENTE-app" --exclusively --require-approval never
          aws cloudformation set-stack-policy --stack-name "financial-$AMBIENTE-app" \
            --stack-policy-body file://politicas/app.json
          ENDERECO=$(aws cloudformation describe-stacks --stack-name "financial-$AMBIENTE-app" \
            --query "Stacks[0].Outputs[?OutputKey=='Endereco'].OutputValue" --output text)
          echo "ENDERECO=$ENDERECO" >> "$GITHUB_ENV"

      - name: Teste de fumaça
        run: |
          scripts/conferir-deploy.sh "$ENDERECO"
          echo "### $AMBIENTE no ar em $ENDERECO" >> "$GITHUB_STEP_SUMMARY"
