name: Deploy

# O merge na main publica em prod; push em outra branch, ou o botão, publica em dev.
# Ordem: banco e login, migrations no DSQL, build da PWA com o login do ambiente, Lambda e
# site, teste de fumaça (ADR 0010).
on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "web/**"
      - "infra/**"
      - "config/**"
      - "scripts/empacotar-lambda.sh"
      - "scripts/conferir-deploy.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: credencial temporária, sem chave de longa duração

jobs:
  deploy:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    env:
      AMBIENTE: ${{ github.ref_name == 'main' && github.event_name == 'push' && 'prod' || 'dev' }}
    # Um deploy por vez em cada pilha; o dev é dividido por todas as branches.
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && github.event_name == 'push' && 'prod' || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            infra/package-lock.json

      - name: Conta e região da configuração
        run: |
          echo "AWS_CONTA=$(jq -r .conta config/aws.json)" >> "$GITHUB_ENV"
          echo "AWS_REGIAO=$(jq -r .regiao config/aws.json)" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_CONTA }}:role/financial-app-deploy
          aws-region: ${{ env.AWS_REGIAO }}

      - name: Pacote da Lambda e CDK
        # O primeiro build da PWA só serve à síntese: sem web/dist o CDK deixa a pilha do app
        # de fora e as exportações que ela importa sumiriam da pilha de dados.
        run: |
          scripts/empacotar-lambda.sh
          (cd web && npm ci && npm run build)
          (cd infra && npm ci)

      - name: Banco e login (pilha de dados)
        working-directory: infra
        run: |
          npx cdk deploy "financial-$AMBIENTE-dados" --exclusively --require-approval never
          aws cloudformation set-stack-policy --stack-name "financial-$AMBIENTE-dados" \
            --stack-policy-body file://politicas/dados.json

      - name: Migrations no DSQL, antes da Lambda nova
        working-directory: backend
        run: |
          export DSQL_ENDPOINT=$(aws cloudformation describe-stacks --stack-name "financial-$AMBIENTE-dados" \
            --query "Stacks[0].Outputs[?OutputKey=='DsqlEndpoint'].OutputValue" --output text)
          uv run --no-dev python -m app.migrations

      - name: Build da PWA com o user pool do ambiente
        working-directory: web
        run: |
          saida() {
            aws cloudformation describe-stacks --stack-name "financial-$AMBIENTE-dados" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          export VITE_COGNITO_USER_POOL_ID=$(saida UserPoolId)
          export VITE_COGNITO_CLIENTE_ID=$(saida ClienteDoAppId)
          npm run build

      - name: Lambda, HTTP API e site (pilha do app)
        working-directory: infra
        run: |
          npx cdk deploy "financial-$AMBIENTE-app" --exclusively --require-approval never
          aws cloudformation set-stack-policy --stack-name "financial-$AMBIENTE-app" \
            --stack-policy-body file://politicas/app.json
          ENDERECO=$(aws cloudformation describe-stacks --stack-name "financial-$AMBIENTE-app" \
            --query "Stacks[0].Outputs[?OutputKey=='Endereco'].OutputValue" --output text)
          echo "ENDERECO=$ENDERECO" >> "$GITHUB_ENV"

      - name: Teste de fumaça
        run: |
          scripts/conferir-deploy.sh "$ENDERECO"
          echo "### $AMBIENTE no ar em $ENDERECO" >> "$GITHUB_STEP_SUMMARY"
