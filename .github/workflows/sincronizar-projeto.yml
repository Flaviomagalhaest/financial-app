name: Sincronizar projeto

# Na main, só os tickets que o push mudou recebem o estado completo, para não desfazer o DOING/FINISHED
# de uma branch ainda não mesclada (ticket 170); rodado à mão na main (workflow_dispatch), espelha todos.
# Só a main põe issue no projeto, e tira as que não são de nenhum ticket dela (ticket 12).
# Nas outras branches, só os tickets que a branch mudou e que já estão no projeto, para a coluna
# andar antes do merge; o ticket novo da branch entra no merge.
on:
  push:
    paths:
      - ".scratch/**/issues/*.md"
      - "scripts/sincronizar-projeto.sh"
  workflow_dispatch:

concurrency:
  group: sincronizar-projeto

permissions:
  contents: read

jobs:
  sincronizar:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Espelhar os tickets no projeto
        env:
          # PAT com escopos `project` e `repo` (o GITHUB_TOKEN não alcança projetos de usuário)
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          ANTES: ${{ github.event.before }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::falta o secret PROJECT_TOKEN (veja o ticket 07)"
            exit 1
          fi
          if [ "$BRANCH" = main ]; then
            if [ "$EVENTO" = push ] && [ -n "$ANTES" ] \
              && [ "$ANTES" != 0000000000000000000000000000000000000000 ] \
              && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
              scripts/sincronizar-projeto.sh --tirar-sem-ticket --desde "$ANTES"
            else
              scripts/sincronizar-projeto.sh --tirar-sem-ticket  # à mão: todos os tickets (--tudo)
            fi
            exit 0
          fi
          # Push anterior da branch; no primeiro push (ou à mão), compara com a main
          if [ -z "$ANTES" ] || [ "$ANTES" = 0000000000000000000000000000000000000000 ] \
            || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            ANTES=$(git merge-base origin/main HEAD)
          fi
          mapfile -t tickets < <(git diff --name-only --diff-filter=AM "$ANTES" HEAD -- '.scratch/*/issues/*.md')
          if [ ${#tickets[@]} -eq 0 ]; then
            echo "nenhum ticket mudou nesta branch"
            exit 0
          fi
          scripts/sincronizar-projeto.sh --so-no-projeto "${tickets[@]}"
