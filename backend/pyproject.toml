[project]
name = "financial-app-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40",
  "fastapi>=0.115",
  "mangum>=0.19",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.10",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
